name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck & Test Coverage (80%+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security guard — forbid .xlsx or .env files in repo
        run: |
          if git ls-files | grep -E '\.(xlsx|xls)$|^\.env(\..+)?$' | grep -v '^\.env\.example$'; then
            echo "ERROR: Prohibited .xlsx or .env file detected in git index!"
            exit 1
          fi

      - name: Run oxlint
        run: npm run lint

      - name: Run Vitest with 80%+ Coverage Gate
        run: npm run test:coverage

      - name: Build production SPA bundle
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SPREADSHEET_ID: ${{ vars.VITE_SPREADSHEET_ID }}
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
